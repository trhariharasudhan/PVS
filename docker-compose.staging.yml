version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pvs_staging_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pvs_silks_staging}
      POSTGRES_USER: ${POSTGRES_USER:-pvs_staging_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staging_secure_password_2026}
    ports:
      - "5432:5432"
    volumes:
      - staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pvs_staging_user} -d ${POSTGRES_DB:-pvs_silks_staging}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pvs_staging_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: staging
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:-staging_secret_key_minimum_64_characters_long_for_security_pvs}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pvs_staging_user}:${POSTGRES_PASSWORD:-staging_secure_password_2026}@postgres:5432/${POSTGRES_DB:-pvs_silks_staging}
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,https://staging.pvssilks.com"
      COOKIE_SECURE: "false"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pvs_staging_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    ports:
      - "3000:3000"

volumes:
  staging_pgdata:
    driver: local
